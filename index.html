<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دونگ</title>
<script src="config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#242850">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f27;--mut:#6b7380;--bd:#eceff3;--ac2:#b7791f;--tint:#eef0ff;--ac:#2f6df6;--acx:#fff;--ok:#16a34a;--no:#dc2626;--pv:#b45309;--pvb:#fef3c7;--pb:#dcfce7;--pt:#166534;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--tx:#eceef2;--mut:#9aa3b0;--bd:#282d36;--ac2:#f6c453;--tint:#242850;--ac:#5b8cff;--acx:#0b1020;--ok:#4ade80;--no:#f87171;--pv:#fcd34d;--pvb:#3a2e0a;--pb:#10301c;--pt:#86efac}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;line-height:1.7}
.w{max-width:640px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:18px;font-weight:800;text-align:center;margin:0 0 12px;background:var(--tint);color:var(--ac2);border-radius:10px;padding:9px 12px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
input[type=text],select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
.r{display:flex;gap:8px}.r>*{flex:1}.r>button{flex:0 0 auto}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:var(--acx);cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--mut);padding:4px 8px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--bd);border-radius:20px;padding:4px 12px;font-size:14px;cursor:pointer;user-select:none;background:var(--bg)}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg div{flex:1;text-align:center;padding:8px;cursor:pointer;font-size:14px}
.seg .on{background:var(--ac);color:var(--acx);font-weight:600}
.lab{font-size:13px;color:var(--mut);margin:4px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd);gap:8px}
.row:first-of-type{border-top:0}
.b{font-size:11px;border-radius:8px;padding:1px 8px;margin-inline-start:6px}
.b.pu{background:var(--pb);color:var(--pt)}.b.pr{background:var(--pvb);color:var(--pv)}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--no);font-weight:600}
.s{font-size:12px;color:var(--mut)}.err{color:var(--no);margin-top:4px}
.msg{text-align:center;color:var(--mut);padding:30px 10px}
.sh{display:flex;align-items:center;gap:8px}.sh span{flex:1}.sh input{margin:0;flex:1;min-width:90px}.sh .plus{flex:0 0 auto;padding:6px 10px}.pv{margin:-2px 0 6px}input:focus,textarea:focus{outline:2px solid var(--ac)}#fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-end:18px;width:56px;height:56px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.28);z-index:40}body.kp #fab{display:none!important}#kp{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--bd);padding:4px 8px calc(8px + env(safe-area-inset-bottom,0px))}.kh{display:flex;justify-content:space-between;align-items:center;margin-bottom:0;line-height:1.4;max-width:520px;margin-inline:auto}.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;direction:ltr;max-width:520px;margin:0 auto}.kg button{height:54px;font-family:"Google Sans",Roboto,"Segoe UI",system-ui,sans-serif;font-size:26px;font-weight:400;padding:0;background:transparent;color:var(--tx);border:0;border-radius:12px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.kg button:active{background:var(--bd)}.kg button.o{color:var(--ac);font-size:28px}.kg button.cc{color:var(--no);font-size:22px}.kg button.ok{background:var(--ac);color:var(--acx);border-radius:27px}.kg button.ok:active{background:var(--ac);opacity:.85}.xb{flex:1;width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;line-height:1.7;resize:none;overflow:hidden;margin:0}.cr{display:inline-block;width:2px;height:1.15em;background:var(--ac);vertical-align:text-bottom;margin:0 -1px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}.xb i{font-style:normal}body.kp{padding-bottom:340px}
.xe{font-size:11px;line-height:1.35;word-break:break-all;text-align:right;color:var(--mut)}.th{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 6px}.mr{display:flex;align-items:center;gap:6px;flex:0 1 auto;min-width:0}#meh select{margin:0;width:auto;max-width:150px;padding:7px 8px;font-size:13px;border-color:var(--ac2)}.th h1{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis}.mb{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:14px;white-space:nowrap;background:var(--tint);color:var(--ac2);border:1px solid var(--bd)}.mb .ar2{color:inherit}.gid{font-size:10px;color:var(--mut);text-align:center;cursor:pointer;user-select:none;line-height:1.3}.gid bdi{letter-spacing:.5px}#mp{margin-top:4px}.ah{position:relative;display:flex;justify-content:center;align-items:center;cursor:pointer;font-weight:800;font-size:18px;background:var(--tint);color:var(--ac2);border-radius:10px;padding:10px 40px}.ar{position:absolute;inset-inline-end:12px;top:50%;margin-top:-8px;display:flex;opacity:.85;transition:transform .2s}.ah.open .ar{transform:rotate(180deg)}.ar2{display:inline-flex;vertical-align:middle;color:var(--mut);transition:transform .2s}.ar2.open{transform:rotate(180deg)}.ab{margin-top:12px}.acc{padding:12px 14px}.det{background:var(--bg);border-radius:10px;padding:10px 12px;margin:0 0 8px;font-size:14px}.det .row{padding:4px 0}
</style>
</head>
<body>
<div class="w" id="app"><div class="msg">در حال بارگذاری…</div></div>
<script type="module">
// ---- adapter: the app talks to a small PHP/MySQL API on your host (live updates by polling every 3s) ----
const API=window.DONG_API||'';
const live=/^https?:\/\//.test(API)&&!/YOUR/i.test(API);
let UID=null;try{UID=localStorage.getItem('dong_uid');if(!UID){UID=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('dong_uid',UID)}}catch(e){}
const post=async b=>{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||'http');return j};
const split=p=>{const i=p.lastIndexOf('/');return [p.slice(0,i),p.slice(i+1)]};
const ws=j=>({docs:j.docs.map(d=>({id:d.id,data:()=>d.data,pending:false})),empty:!j.docs.length,metadata:{fromCache:false}});
const subs=new Map();let seq=0,timer=null,inflight=false,again=false;
async function tick(){if(inflight){again=true;return}if(!subs.size||document.hidden)return;inflight=true;
  try{const arr=[...subs.values()],j=await post({op:'poll',subs:arr.map(s=>({col:s.col,v:s.v}))});
    (j.changes||[]).forEach(c=>{const s=arr[c.i];if(s&&subs.has(s.id)){s.v=c.v;s.cb(ws({docs:c.docs}))}})}catch(e){}
  inflight=false;if(again){again=false;tick()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
const w=async o=>{const r=await post(o);setTimeout(tick,30);return r};
const dbx=live&&{collection:p=>({
    onSnapshot:(n,e)=>{const s={id:++seq,col:p,v:null,cb:n};subs.set(s.id,s);if(!timer)timer=setInterval(tick,3000);tick();return()=>{subs.delete(s.id)}},
    add:o=>w({op:'set',col:p,id:Date.now().toString(36)+Math.random().toString(36).slice(2,10),data:o}),
    get:async()=>ws(await post({op:'list',col:p}))}),
  doc:p=>{const [c,i]=split(p);return {get:async()=>{const j=await post({op:'get',col:c,id:i});return{exists:!!j.exists,data:()=>j.data,id:i}},
    set:o=>w({op:'set',col:c,id:i,data:o}),update:o=>w({op:'update',col:c,id:i,data:o}),delete:()=>w({op:'delete',col:c,id:i})}}};
const claude={use:async n=>{if(!dbx||!UID)return null;return n==='db'?dbx:{id:async()=>UID}}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const en=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const fd=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const fa=n=>Math.round(n).toLocaleString('fa-IR');
const toNum=s=>Number(en(s).replace(/[^0-9]/g,''))||0;
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const pad=n=>String(n).padStart(2,'0');
function today(){const p={};new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return p.year+'/'+p.month+'/'+p.day}
function normDate(v){const m=en(v).trim().replace(/[-.]/g,'/').match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);if(!m)return null;const mo=+m[2],d=+m[3];return mo<1||mo>12||d<1||d>31?null:m[1]+'/'+pad(mo)+'/'+pad(d)}
const tm=n=>fa(n)+' تومان';
const CH='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function calc(s){s=en(s).replace(/[٬,،\s]/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  if(!s||!/^[0-9+\-*/().%]+$/.test(s))return NaN;let i=0,pf=false;
  // x+y% means x+(x*y%) ; x*y% and x/y% use plain y/100
  const un=()=>{pf=false;let v;if(s[i]==='-'){i++;return -un()}
    if(s[i]==='('){i++;v=add();if(s[i]!==')')throw 0;i++}
    else{const j=i;while(/[0-9.]/.test(s[i]||''))i++;if(j===i)throw 0;v=parseFloat(s.slice(j,i))}
    if(s[i]==='%'){i++;v/=100;pf=true}else pf=false;return v};
  const mul=()=>{let v=un(),one=pf;while(s[i]==='*'||s[i]==='/'){const o=s[i++],r=un();v=o==='*'?v*r:v/r;one=false}pf=one;return v};
  const add=()=>{let v=mul();while(s[i]==='+'||s[i]==='-'){const o=s[i++];let r=mul();if(pf)r=v*r;v=o==='+'?v+r:v-r;pf=false}return v};
  try{const v=add();return i===s.length&&isFinite(v)?Math.round(v):NaN}catch(e){return NaN}}
let db,myId=null,P=[],cur=null,unsub=null,view='home',HS={};
let st={payer:'',sel:{},mode:'equal',cust:{},ex:{},car:{},edit:null,cl:0,auto:null,open:null};
const pcol=()=>'data/users/'+myId;
const pc=()=>db.collection(pcol());
// offline outbox: writes that cannot reach the server are kept in this browser and re-sent when online
const OB='dong_ob';let OBQ=[];try{OBQ=JSON.parse(localStorage.getItem(OB)||'[]')}catch(e){}
const obSave=()=>{try{localStorage.setItem(OB,JSON.stringify(OBQ))}catch(e){}};
const tmo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r('timeout'),ms))]);
const transient=e=>e==='timeout'||(e&&e.code==='unavailable');
function banner(){const n=$('obn');if(!n)return;const c=(cur&&cur.entries?cur.entries.filter(e=>e._pending).length:0)+OBQ.length;n.style.display=c?'':'none';n.textContent=c?'⏳ '+fa(c)+' مورد ارسال نشده؛ با برقراری اینترنت خودکار ارسال می‌شود.':''}
let flushing=false;
async function flush(){if(flushing||!OBQ.length||!db)return;flushing=true;
  while(OBQ.length){try{await tmo(db.doc(OBQ[0].path).set(OBQ[0].data),10000);OBQ.shift();obSave()}catch(e){if(transient(e))break;OBQ.shift();obSave()}}
  flushing=false;banner();if(view==='group'&&cur)renderParts()}
window.addEventListener('online',flush);setInterval(flush,15000);
document.addEventListener('focusin',e=>{if(st.focus&&!e.target.closest('#shr')&&!e.target.closest('#kp'))closeKp()});
(async function init(){
  db=await claude.use('db');const user=await claude.use('user');
  try{myId=user?await user.id():null}catch(e){}
  if(!db||!myId){$('app').innerHTML='<div class="msg">اتصال به سرور برقرار نشد. اینترنت و آدرس api در فایل config.js را بررسی کنید.</div>';return}
  homeShell();flush();
  pc().onSnapshot(s=>{P=s.docs.map(d=>({...d.data(),_d:d.id}));if(view==='home'){syncSubs();renderHome()}else if(cur&&P.some(x=>x._d===cur.pid))renderParts()},()=>{});
})();
function armed(b,fn){let t;b.onclick=()=>{if(b.dataset.a){clearTimeout(t);fn();return}b.dataset.a=1;const o=b.textContent;b.textContent='مطمئنی؟';t=setTimeout(()=>{delete b.dataset.a;b.textContent=o},3000)}}
const joinedList=()=>{const d=new Set(P.filter(e=>e.t==='del').map(e=>e.ref));return P.filter(e=>e.t==='joined'&&e.v===2&&!d.has(e.id)).sort((a,b)=>b.at-a.at)};
const rc=()=>String(1000+Math.floor(Math.random()*9000));
async function freeCode(){for(let k=0;k<40;k++){const c=rc();if(!(await db.doc('codes/'+c).get()).exists)return c}throw 0}
function build(es){es=es.slice().sort((a,b)=>a.at-b.at);const d=new Set(es.filter(e=>e.t==='del').map(e=>e.ref)),meta=es.find(e=>e.t==='meta'),lk=es.filter(e=>e.t==='lock').pop(),cl={};es.filter(e=>e.t==='claim').forEach(c=>cl[c.pid]=c.by);
  return {people:es.filter(e=>e.t==='person'&&!d.has(e.id)),exps:es.filter(e=>e.t==='exp'&&!d.has(e.id)),pays:es.filter(e=>e.t==='pay'&&!d.has(e.id)),name:meta&&meta.name,vc:meta&&meta.vc,ac:meta&&meta.ac,locked:!!(lk&&lk.v),claims:cl}}
function balances(m){const b={};m.people.forEach(p=>b[p.id]=0);m.exps.forEach(e=>{if(!(e.payer in b))return;b[e.payer]+=e.amount;Object.entries(e.shares||{}).forEach(([i,v])=>{if(i in b)b[i]-=v})});(m.pays||[]).forEach(p=>{if(p.from in b)b[p.from]+=p.amount;if(p.to in b)b[p.to]-=p.amount});return b}
const balTxt=v=>Math.abs(v)<0.5?'<span>تسویه‌شده ✓</span>':v>0?`<span class="pos">بستانکار ${tm(v)}</span>`:`<span class="neg">بدهکار ${tm(-v)}</span>`;

// ----- home: one live summary per group -----
function stopSubs(){Object.values(HS).forEach(h=>h.u());HS={}}
function syncSubs(){const gs=joinedList(),keep=new Set(gs.map(g=>g.gid));
  Object.keys(HS).forEach(k=>{if(!keep.has(k)){HS[k].u();delete HS[k]}});
  gs.forEach(g=>{if(HS[g.gid])return;const h=HS[g.gid]={es:null,u:null};
    h.u=db.collection('gx_'+g.gid).onSnapshot(s=>{
      if(s.empty&&!s.metadata.fromCache){P.filter(x=>x.gid===g.gid).forEach(x=>db.doc(pcol()+'/'+x._d).delete().catch(()=>{}));return}
      h.es=s.docs.map(d=>d.data());if(view==='home')renderHome()},()=>{})})}
function homeShell(){kpUnpush();document.body.classList.remove('kp');view='home';cur=null;if(unsub){unsub();unsub=null}
  $('app').innerHTML=`<h1>🧾 دونگ</h1>
  <div class="c"><h2>گروه‌های من</h2><div id="gl"></div></div>
  <div class="c"><h2>ساخت گروه جدید</h2><div class="r"><input type="text" id="gn" placeholder="نام گروه (مثلاً سفر شمال)"><button id="g1">ساخت</button></div><div class="s err" id="e1"></div></div>
  <div class="c"><h2>ورود با کد</h2><div class="r"><input type="text" id="jc" dir="ltr" inputmode="numeric" maxlength="4" placeholder="کد ۴ رقمی"><button id="g3">ورود</button></div><div class="s err" id="e2"></div></div>`;
  $('g1').onclick=mkGroup;$('g3').onclick=joinGroup;syncSubs();renderHome()}
function renderHome(){const L=$('gl');if(!L)return;const gs=joinedList();
  L.innerHTML=gs.length?gs.map(g=>{const h=HS[g.gid];let sm='…';
    if(h&&h.es){const m=build(h.es);sm=g.me&&m.people.some(p=>p.id===g.me)?balTxt(balances(m)[g.me]):'<span>برای دیدن بدهی/طلب، نام خود را در گروه انتخاب کنید</span>'}
    return `<div class="row" style="cursor:pointer" data-id="${esc(g._d)}"><div><b>${esc(g.name)}</b>${g.role==='admin'?'<span class="b pu">👑 ادمین</span>':''}<div class="s">${sm}</div></div><span class="s">باز کردن ←</span></div>`}).join(''):'<div class="s">هنوز عضو گروهی نیستید.</div>';
  L.querySelectorAll('.row').forEach(r=>r.onclick=()=>openGroup(gs.find(x=>x._d===r.dataset.id)))}
let busy=false;
const setBtn=(id,on,t)=>{const b=$(id);if(b){b.disabled=on;if(t)b.textContent=t}};
async function mkGroup(){if(busy)return;const n=$('gn').value.trim(),e=$('e1');e.style.color='';e.textContent='';if(!n)return e.textContent='نام گروه را بنویسید.';
  busy=true;setBtn('g1',true,'در حال ساخت…');e.style.color='var(--mut)';e.textContent='در حال ساخت گروه، چند لحظه صبر کنید…';
  try{const gid=rid(),vc=await freeCode();await db.doc('codes/'+vc).set({gid});
    await db.collection('gx_'+gid).add({t:'meta',name:n,vc,owner:myId,at:Date.now()});
    await pc().add({t:'joined',v:2,id:rid(),gid,role:'admin',name:n,at:Date.now()});
    if($('gn'))$('gn').value='';e.textContent=''}
  catch(x){e.style.color='';e.textContent='ساخت گروه ممکن نشد (دسترسی ویرایش لازم است).'}
  busy=false;setBtn('g1',false,'ساخت')}
async function joinGroup(){if(busy)return;const e=$('e2');e.style.color='';e.textContent='';const c=en($('jc').value).replace(/\D/g,'');if(c.length!==4)return e.textContent='کد باید ۴ رقم باشد.';
  busy=true;setBtn('g3',true,'…');
  try{const d=await db.doc('codes/'+c).get();if(!d.exists)throw 'bad';
    const gid=d.data().gid;if(joinedList().some(x=>x.gid===gid))throw 'dup';
    const s=await db.collection('gx_'+gid).get();if(s.empty)throw 'bad';const m=s.docs.map(x=>x.data()).find(x=>x.t==='meta');
    await pc().add({t:'joined',v:2,id:rid(),gid,role:'member',name:m?m.name:'گروه',at:Date.now()});if($('jc'))$('jc').value=''}
  catch(x){e.textContent=x==='dup'?'قبلاً عضو این گروه هستید.':x==='bad'?'کد نامعتبر است.':'ورود ممکن نشد.'}
  busy=false;setBtn('g3',false,'ورود')}

// ----- group -----
function openGroup(g){stopSubs();
  const tok={pid:g._d,name:g.name,gid:g.gid,role:g.role,entries:[]};
  cur=tok;st={payer:'',sel:{},mode:'equal',cust:{},ex:{},car:{},edit:null,cl:0,auto:null,open:null};groupShell();

  $('plist').innerHTML=m.people.length?m.people.map(p=>`<span class="chip">${esc(p.name)}</span>`).join(''):'<span class="s">هنوز عضوی اضافه نشده.</span>';
  const hdr=!J.me&&m.people.length>0,me=$('me'),slot=hdr?$('meh'):$('mep');if(me.parentNode!==slot)slot.appendChild(me);$('mel').style.display=hdr?'none':'';
  $('me').innerHTML='<option value="">'+(hdr?'شما کدام عضو هستید؟':'انتخاب کنید…')+'</option>'+m.people.filter(p=>!m.claims[p.id]||m.claims[p.id]===myId||p.id===J.me).map(p=>`<option value="${esc(p.id)}"${p.id===J.me?' selected':''}>${esc(p.name)}</option>`).join('');

  $('py').innerHTML=m.people.map(p=>`<option value="${esc(p.id)}"${p.id===st.payer?' selected':''}>${esc(p.name)}</option>`).join('');
  $('pp').innerHTML=m.people.map(p=>`<span class="chip ${st.sel[p.id]!==false?'on':''}" data-id="${esc(p.id)}">${esc(p.name)}</span>`).join('');
  $('pp').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{st.sel[c.dataset.id]=st.sel[c.dataset.id]===false;c.classList.toggle('on',st.sel[c.dataset.id]!==false);clrAuto();renderShares()});
  if(!document.activeElement||!document.activeElement.closest('#shr'))renderShares();
  const bal=balances(m),nm=id=>(m.people.find(p=>p.id===id)||{name:'؟'}).name;
  {const o=m.people.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join(''),f=$('pf'),t=$('pt'),a=f.value,b=t.value;f.innerHTML=o;t.innerHTML=o;if(a)f.value=a;if(b)t.value=b;else if(t.options.length>1)t.selectedIndex=1}
  $('mine').innerHTML=J.me&&J.me in bal?'وضع شما: '+balTxt(bal[J.me]):'';
  $('bal').innerHTML=m.people.length?m.people.map(p=>`<div class="row"><span>${esc(p.name)}</span>${balTxt(bal[p.id])}</div>`).join(''):'<div class="s">هنوز عضوی نیست.</div>';
  const cr=[],de=[];m.people.forEach(p=>{const v=Math.round(bal[p.id]);if(v>0)cr.push({id:p.id,v});else if(v<0)de.push({id:p.id,v:-v})});
  cr.sort((a,b)=>b.v-a.v);de.sort((a,b)=>b.v-a.v);const tx=[];let i=0,j=0;
  while(i<de.length&&j<cr.length){const x=Math.min(de[i].v,cr[j].v);if(x>0)tx.push({f:de[i].id,t:cr[j].id,a:x});de[i].v-=x;cr[j].v-=x;if(!de[i].v)i++;if(!cr[j].v)j++}
  $('set').innerHTML=tx.length?'<div class="lab" style="margin-top:12px">پیشنهاد پرداخت:</div>'+tx.map((t,k)=>`<div class="row"><span>${esc(nm(t.f))} ← ${tm(t.a)} ← ${esc(nm(t.t))}</span><button class="g" data-pay="${k}">ثبت پرداخت</button></div>`).join(''):'';
  $('set').querySelectorAll('button[data-pay]').forEach(b=>armed(b,async()=>{const t=tx[b.dataset.pay];try{await put({t:'pay',id:rid(),from:t.f,to:t.t,amount:t.a,date:today()})}catch(e){}}));
  const all=[...m.exps,...m.pays].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.at-a.at),rw=(k,v)=>`<div class="row"><span>${k}</span><span>${v}</span></div>`;
  $('list').innerHTML=all.length?all.map(e=>{const o=st.open===e.id,pay=e.t==='pay';
    const head=pay?`<div><b>💸 پرداخت</b><div class="s">${fd(e.date||'')} · ${esc(nm(e.from))} به ${esc(nm(e.to))}</div></div>`:`<div><b>${esc(e.title)}</b>${e.custom?'<span class="b pr">نامساوی</span>':''}<div class="s">${fd(e.date||'')} · ${esc(nm(e.payer))} پرداخت کرد</div></div>`;
    let det='';
    if(o)det='<div class="det">'+(pay?rw('تاریخ',fd(e.date||''))+rw('پرداخت‌کننده',esc(nm(e.from)))+rw('گیرنده',esc(nm(e.to)))+rw('مبلغ',tm(e.amount)):rw('تاریخ',fd(e.date||''))+rw('مبلغ کل',tm(e.amount))+rw('پرداخت‌کننده',esc(nm(e.payer)))+rw('نوع تقسیم',e.custom?'دلخواه':'مساوی')+'<div class="lab">سهم هر نفر:</div>'+Object.entries(e.shares||{}).map(([i,v])=>rw(esc(nm(i)),tm(v))).join(''))+(A&&!e._pending?`<div style="margin-top:6px">${pay?'':`<button class="g" data-edit="${esc(e.id)}">✏️ ویرایش</button>`}<button class="g" data-del="${esc(e.id)}">${pay?'حذف این پرداخت':'حذف این هزینه'}</button></div>`:'')+'</div>';
    return `<div class="row" style="cursor:pointer" data-id="${esc(e.id)}">${head}<div style="white-space:nowrap">${e._pending?'<span class="b pr">⏳</span>':''}${tm(e.amount)} <span class="ar2${o?' open':''}">${CH}</span></div></div>`+det}).join(''):'<div class="s">هنوز هزینه‌ای ثبت نشده.</div>';
  $('list').querySelectorAll('.row[data-id]').forEach(r=>r.onclick=()=>{st.open=st.open===r.dataset.id?null:r.dataset.id;renderParts()});
  $('list').querySelectorAll('button[data-del]').forEach(b=>armed(b,async()=>{const e=all.find(x=>x.id===b.dataset.del);if(!e)return;try{if(e._d)await db.doc('gx_'+cur.gid+'/'+e._d).delete();st.open=null}catch(x){}}));$('list').querySelectorAll('button[data-edit]').forEach(b=>b.onclick=()=>{const e=m.exps.find(x=>x.id===b.dataset.edit);if(e)startEdit(e)})}
</script>

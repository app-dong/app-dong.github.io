ا بزنید تا قفل شود؛ هر وقت لازم بود می‌توانید قفل را باز کنید.</p></div></div><div class="hlp-step"><span class="hlp-n">۳</span><div><b>دعوت دوستان</b><p>هر گروه یک «شناسه‌ی گروه» ۴ رقمی دارد که بالای صفحه‌ی گروه نوشته شده؛ روی آن بزنید تا کپی شود. یا از منوی <i>⋮</i> گزینه‌ی «ارسال دعوت به گروه» را بزنید. دوستانتان در صفحه‌ی اول <i>«🔑 ورود با کد دعوت»</i> را می‌زنند و شناسه را وارد می‌کنند.</p></div></div><div class="hlp-step"><span class="hlp-n">۴</span><div><b>انتخاب اسم خودتان</b><p>هر کس که وارد گروه می‌شود باید در بخش <i>«شما کدام عضو هستید؟»</i> اسم خودش را انتخاب کند. تا این کار انجام نشود فقط تماشاگر است و نمی‌تواند هزینه یا پرداخت ثبت کند. هر اسم را فقط یک نفر می‌تواند انتخاب کند.</p></div></div><div class="hlp-sec">ثبت و حساب‌کتاب</div><div class="hlp-step"><span class="hlp-n">۵</span><div><b>ثبت هزینه</b><p>دکمه‌ی شناور <i>«ثبت هزینه جدید»</i> پایین صفحه را بزنید و بابت، مبلغ، تاریخ، پرداخت‌کننده و سهم‌ها را مشخص کنید. سهم‌ها را می‌شود <i>مساوی</i> تقسیم کرد یا با <i>مبلغ دلخواه</i> برای هر نفر (با ماشین‌حساب داخلی که + − × ÷ ( ) و % دارد) وارد کرد.</p></div></div><div class="hlp-step"><span class="hlp-n">۶</span><div><b>هزینه‌ی چند نفره‌ی خصوصی</b><p>اگر همه‌ی اعضا را در سهم‌ها انتخاب نکنید (مثلاً ۳ نفر از ۱۰ نفر بیرون رفته‌اند)، آن هزینه فقط برای پرداخت‌کننده، ثبت‌کننده و کسانی که سهم دارند دیده می‌شود. بقیه نه خود هزینه را می‌بینند و نه اثرش را روی بدهی و طلب دیگران.</p></div></div><div class="hlp-step"><span class="hlp-n">۷</span><div><b>تسویه حساب</b><p>در تب <i>«تسویه حساب»</i> می‌بینید هر نفر بدهکار است یا بستانکار، و فهرستی از «پیشنهاد پرداخت» با کمترین تعداد انتقال. بعد از اینکه واقعاً پول را دادید، <i>«ثبت پرداخت»</i> را بزنید تا از حساب کم شود. برای پرداخت‌های دلخواه هم «+ ثبت پرداخت دلخواه» هست.</p></div></div><div class="hlp-step"><span class="hlp-n">۸</span><div><b>لیست هزینه‌ها</b><p>تب <i>«هزینه‌ها»</i> فقط هزینه‌هایی را نشان می‌دهد که خودتان در آن‌ها نقش دارید. روی هر مورد بزنید تا جزئیات و سهم هر نفر باز شود؛ ثبت‌کننده‌ی هزینه (یا ادمین) می‌تواند آن را ویرایش یا حذف کند.</p></div></div><div class="hlp-sec">امکانات بیشتر</div><div class="hlp-step"><span class="hlp-n">۹</span><div><b>تاریخچه و بازگرداندن</b><p>از منوی <i>⋮</i> بالای صفحه‌ی گروه، <i>«تاریخچه»</i> را بزنید تا ثبت، ویرایش و حذف‌ها را ببینید. هزینه‌ها و پرداخت‌های حذف‌شده تا ۷ روز می‌مانند و می‌توانید بازگردانی‌شان کنید.</p></div></div><div class="hlp-step"><span class="hlp-n">۱۰</span><div><b>خروجی تصویر</b><p>از منوی <i>⋮</i> گزینه‌ی <i>«خروجی تصویر»</i> را بزنید، هزینه‌های دلخواه را تیک بزنید و یک عکس از هزینه‌ها، سهم هر نفر و تسویه حساب بگیرید تا در گروه‌های چت بفرستید.</p></div></div><div class="hlp-step"><span class="hlp-n">۱۱</span><div><b>مدیریت گروه‌ها</b><p>در صفحه‌ی اول، روی <i>⋮</i> کنار هر گروه (یا نگه داشتن انگشت روی آن) گزینه‌های کپی شناسه، ارسال دعوت و حذف/ترک گروه را می‌دهد. ادمین با حذف گروه آن را برای همه پاک می‌کند؛ بقیه فقط از لیست خودشان خارج می‌شوند. دکمه‌ی ماه/خورشید کنار «راهنما» هم حالت شب و روز را عوض می‌کند.</p></div></div><button class="sb primary" id="sx">متوجه شدم</button></div>`;document.body.appendChild(s);try{history.pushState({sh:1},""),P=!0}catch{}s.onclick=m=>{m.target===s&&C()},l("sx").onclick=()=>C()}function Xt(t){C();let e=t==="n",n=document.createElement("div");n.id="shb",n.className="ct",n.innerHTML=`<div id="shs"><div class="shn">${e?"\u0633\u0627\u062E\u062A \u06AF\u0631\u0648\u0647 \u062C\u062F\u06CC\u062F":"\u0648\u0631\u0648\u062F \u0628\u0627 \u06A9\u062F \u062F\u0639\u0648\u062A"}</div>${e?'<input type="text" id="gn" maxlength="40" placeholder="\u0646\u0627\u0645 \u06AF\u0631\u0648\u0647 (\u0645\u062B\u0644\u0627\u064B \u0633\u0641\u0631 \u0634\u0645\u0627\u0644)">'+(Nm()?'':'<input type="text" id="gme" maxlength="30" placeholder="نام شما (مثلاً علی)"><div class="s" style="text-align:center;margin:-4px 2px 8px">نام شما به‌عنوان اولین عضو گروه اضافه می‌شود.</div>'):'<input type="text" id="jc" dir="ltr" inputmode="numeric" maxlength="4" placeholder="\u06A9\u062F \u06F4 \u0631\u0642\u0645\u
